PLG_MEDIA-ACTION_SANITIZEFILENAME="Media Action - Sanitize Filename"
PLG_MEDIA-ACTION_SANITIZEFILENAME_XML_DESCRIPTION="Automatically sanitizes uploaded filenames by replacing spaces with hyphens, converting to lowercase, and removing special characters. Letters of any script are preserved, with optional transliteration to ASCII."

PLG_MEDIA-ACTION_SANITIZEFILENAME_FIELDSET_LABEL="Sanitize Filename Settings"
PLG_MEDIA-ACTION_SANITIZEFILENAME_FIELDSET_DESC="Configure how filenames should be sanitized during upload"

PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACE_SPACES_LABEL="Replace Spaces"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACE_SPACES_DESC="Replace spaces and underscores in filenames"

PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACEMENT_CHAR_LABEL="Replacement Character"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACEMENT_CHAR_DESC="Choose which character to use when replacing spaces and underscores"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACEMENT_HYPHEN="Hyphen (-)"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACEMENT_UNDERSCORE="Underscore (_)"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACEMENT_DOT="Dot (.)"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REPLACEMENT_NONE="Remove (no replacement)"

PLG_MEDIA-ACTION_SANITIZEFILENAME_LOWERCASE_LABEL="Convert to Lowercase"
PLG_MEDIA-ACTION_SANITIZEFILENAME_LOWERCASE_DESC="Convert all characters in the filename to lowercase"

PLG_MEDIA-ACTION_SANITIZEFILENAME_REMOVE_SPECIAL_LABEL="Remove Special Characters"
PLG_MEDIA-ACTION_SANITIZEFILENAME_REMOVE_SPECIAL_DESC="Remove special characters, keeping only letters, marks and numbers of any script, hyphens, underscores, and dots"

PLG_MEDIA-ACTION_SANITIZEFILENAME_TRANSLITERATE_LABEL="Transliterate to ASCII"
PLG_MEDIA-ACTION_SANITIZEFILENAME_TRANSLITERATE_DESC="Convert non-Latin characters (for example Cyrillic or Arabic) to ASCII before sanitizing. When disabled, such characters are kept as they are. Uses the PHP intl extension when available."
